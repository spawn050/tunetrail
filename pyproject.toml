[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tunetrail"
version = "0.1.0"
description = "A personal, terminal-first Spotify controller."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TuneTrail contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<2",
  "langchain-openrouter>=0.2,<2",
  "langgraph>=0.3,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "textual>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pyright>=1.1.390,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
tunetrail = "tunetrail.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tunetrail"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
